[ids]
0001:0001

[global]
# only emit esc if capslock is released within 200ms (no stray esc after a long hold)
overload_tap_timeout = 200

[main]
# --- overloaders ---

# - main layers -
capslock = overload(caps_layer, esc)
rightalt = overload(altgr_layer, layer(altgr))

# - homerow mod -
# plain letter if a key was typed <150ms ago, otherwise hold >2s00ms
# (or tap another key while holding) for the modifier
a = overloadi(a, overloadt2(meta, a, 200), 150)
s = overloadi(s, overloadt2(alt, s, 200), 150)
d = overloadi(d, overloadt2(control, d, 200), 150)
f = overloadi(f, overloadt2(shift, f, 200), 150)
j = overloadi(j, overloadt2(shift, j, 200), 150)
k = overloadi(k, overloadt2(control, k, 200), 150)
l = overloadi(l, overloadt2(alt, l, 200), 150)
; = overloadi(;, overloadt2(meta, ;, 200), 150)

# --- layers ---
[caps_layer]
# modifiers
a = layer(alt)
d = layer(control)
s = layer(shift)

# vim-style nav
h = left
j = down
k = up
l = right

# page nav
u = pageup
i = pagedown

# change kb layout
f = M-space

# action keys
; = enter
o = backspace
[ = delete

# dictation toggle (voxtype)
m = scrolllock

[altgr_layer]
# desktop switch (kde)
a = M-f1
s = M-f2
d = M-f3
f = M-f4

# volume control
h = mute
j = volumedown
k = volumeup

# brightness control
l = brightnessdown
; = brightnessup

# lock screen
o = M-l

# suspend
/ = M-/
