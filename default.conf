[ids]
# Enable only for Lenovo ThinkPad built-in keyboard.
0001:0001

[global]
# Only emit esc if capslock is released within 200ms.
overload_tap_timeout = 200

[main]
# --- Bindings ---

# Change keyboard language (especially for Lenovo ThinkPad).
sysrq = M-space


# --- Modifiers ---

# Launch krunner on single-press, activate Alt on hold.
leftalt = overload(alt, A-space)

# Press Esc on single-press, activate Ctrl on hold.
capslock = overload(control, esc)


# --- Layers definitions ---

# Activate space_layer on hold, activate space on single-press.
space = overloadi(space, overloadt2(space_layer, space, 200), 150)

# Activate altgr_layer on hold, activate altgr on single-press.
rightalt = overload(altgr_layer, layer(altgr))


# --- Homerow modifiers ---

# Plain letter if a key was typed <150ms ago, otherwise hold >200ms.
# (or tap another key while holding) for the modifier.
a = overloadi(a, overloadt2(meta, a, 200), 150)
s = overloadi(s, overloadt2(alt, s, 200), 150)
d = overloadi(d, overloadt2(control, d, 200), 150)
f = overloadi(f, overloadt2(shift, f, 200), 150)
j = overloadi(j, overloadt2(shift, j, 200), 150)
k = overloadi(k, overloadt2(control, k, 200), 150)
l = overloadi(l, overloadt2(alt, l, 200), 150)
; = overloadi(;, overloadt2(meta, ;, 200), 150)


# --- In-layer bindings ---

[space_layer]
# Vim-style navigation.
h = left
j = down
k = up
l = right

# Page navigation.
u = pageup
i = pagedown

# Actions.
; = enter
o = backspace
[ = delete


# --- Functions ---

sysrq = print  # Printscreen
o = M-l        # Lock screen
c = C-c        # Copy
v = C-v        # Paste

# Brave browser: show tab search panel. Meta + ] is a custom shortcut in Brave.
q = M-]

# Web-browser: close tab.
w = C-w

# Dictation toggle (voxtype).
m = scrolllock


# --- Symbols ---

# Makes input easier in Linux.
# Also, typing an underscore is easy with home-row shift mods.
f = -

[altgr_layer]

# --- System control ---

# Suspend. In combination with custom shortcut in KDE Plasma.
/ = M-/ 

# Display brightness.
l = brightnessdown
; = brightnessup


# --- Media control ---

# Volume.
h = mute
j = volumedown
k = volumeup

# Playback.
p = playpause
] = previoussong
\ = nextsong