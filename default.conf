[ids]
0001:0001

[global]
# only emit esc if capslock is released within 200ms (no stray esc after a long hold)
overload_tap_timeout = 200

[main]
# --- combos ---

# cut
#z+x = C-x

# copy
#x+c = C-c

# paste
#c+v = C-v

# select all
#z+v = C-a

# oneshot's
#shift = oneshot(shift)
#control = oneshot(control)
#leftalt = oneshot(alt)
#rightalt = oneshot(altgr)

# --- overloaders ---
tab = overload(nav_layer, tab)
capslock = overload(control, esc)

# --- homerow mods ---
# plain letter if a key was typed <150ms ago, otherwise hold >2s00ms
# (or tap another key while holding) for the modifier
a = overloadi(a, overloadt2(meta, a, 200), 150)
s = overloadi(s, overloadt2(alt, s, 200), 150)
d = overloadi(d, overloadt2(control, d, 200), 150)
f = overloadi(f, overloadt2(shift, f, 200), 150)
j = overloadi(j, overloadt2(shift, j, 200), 150)
k = overloadi(k, overloadt2(control, k, 200), 150)
l = overloadi(l, overloadt2(alt, l, 200), 150)
; = overloadi(;, overloadt2(meta, ;, 200), 150)

# --- layers ---
[nav_layer]

# vim-style navigation
h = left
j = down
k = up
l = right

# page nav
u = pageup
i = pagedown

# change layout
f = M-k

# kde overview
w = M-w

# brave tab search window
q = A-q

# action keys
a = esc
; = enter
o = backspace
[ = delete
space = A-space
capslock = capslock
d = scrolllock

# switch to previous window
r = A-tab

#[sys_layer]
#h = mute
#j = volumedown
#k = volumeup
#l = brightnessdown
#; = brightnessup
#o = M-l
#/ = M-/

# workaround to make activation of Ctrl+F immediate 
#[control]
#f = C-f
#s = C-s
