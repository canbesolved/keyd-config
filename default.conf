[ids]
0001:0001

[global]
# only emit esc if capslock is released within 200ms (no stray esc after a long hold)
overload_tap_timeout = 200

[main]
# --- combos ---

# cut
#z+x = C-x

# copy
#x+c = C-c

# paste
#c+v = C-v

# select all
#z+v = C-a

# oneshot's
#shift = oneshot(shift)
#control = oneshot(control)
#leftalt = oneshot(alt)
#rightalt = oneshot(altgr)

# --- overloaders ---
tab = overload(nav_layer, tab)
capslock = overload(control, esc)

# --- layers ---
[nav_layer]

# vim-style navigation
h = left
j = down
k = up
l = right

# page nav
u = pageup
i = pagedown

# change layout
f = M-k

# kde overview
w = M-w

# brave tab search window
q = A-q

# action keys
a = esc
; = enter
o = backspace
[ = delete
space = A-space
capslock = capslock
d = scrolllock

# switch to previous window
r = A-tab

#[sys_layer]
#h = mute
#j = volumedown
#k = volumeup
#l = brightnessdown
#; = brightnessup
#o = M-l
#/ = M-/

# workaround to make activation of Ctrl+F immediate 
#[control]
#f = C-f
#s = C-s
